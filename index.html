<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JVK Portfolio — projetos, demonstrações públicas e áreas de trabalho." />
    <meta property="og:title" content="JVK Portfolio" />
    <meta property="og:description" content="Projetos, demonstrações públicas e áreas de trabalho." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#101114" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>JVK Portfolio</title>
    <script src="js/locales/pt-BR.js"></script>
    <script src="js/locales/en.js"></script>
    <script src="js/locales/es.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip">Ir para o conteúdo</a>
    <noscript><p class="noscript">Este site precisa de JavaScript para carregar os idiomas e a navegação.</p></noscript>
    <div id="language-modal" class="language-modal" role="dialog" aria-modal="true" aria-labelledby="language-title" aria-hidden="true">
      <div class="language-card">
        <p class="wordmark">JVK</p>
        <h1 id="language-title">Escolha seu idioma</h1>
        <p>Choose your language</p>
        <p>Elige tu idioma</p>
        <div class="language-options">
          <button type="button" data-language="pt-BR">Português</button>
          <button type="button" data-language="en">English</button>
          <button type="button" data-language="es">Español</button>
        </div>
      </div>
    </div>

    <header class="site-header">
      <a class="brand" href="#/" aria-label="JVK Portfolio">JVK<span>Portfolio</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-i18n-aria="menu">Abrir menu</button>
      <nav id="site-navigation" class="site-navigation" aria-label="Navegação principal" data-i18n-aria="mainNav">
        <a href="#/" data-route="home" data-i18n="nav.home">Início</a>
        <a href="#/work" data-route="work" data-i18n="nav.work">Projetos</a>
        <a href="#/areas" data-route="areas" data-i18n="nav.areas">Áreas e ferramentas</a>
        <a href="#/certifications" data-route="certifications" data-i18n="nav.certifications">Certificações</a>
        <a href="#/info" data-route="info" data-i18n="nav.info">Info</a>
        <a href="#/contact" data-route="contact" data-i18n="nav.contact">Contato</a>
        <button class="language-toggle" type="button" aria-expanded="false" aria-controls="language-menu"><span aria-hidden="true">◎</span> <span id="current-language">PT</span></button>
        <div id="language-menu" class="language-menu" hidden>
          <button type="button" data-language="pt-BR">Português</button>
          <button type="button" data-language="en">English</button>
          <button type="button" data-language="es">Español</button>
        </div>
      </nav>
    </header>

    <main id="main-content" tabindex="-1"></main>

    <footer class="site-footer">
      <span>JVK Portfolio</span>
      <a href="#/legal" data-i18n="footer.legal">Legal e status de desenvolvimento</a>
      <span data-i18n="footer.local">Projetos, estudos e demonstrações</span>
    </footer>
    <script src="js/app.js" defer></script>
  </body>
</html>
